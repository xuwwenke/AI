apiVersion: apps/v1
kind: Deployment
metadata:
  name: llmops-knowledge
  namespace: llmops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: llmops-knowledge
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: llmops-knowledge
    spec:
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: api
          image: docker-registry:81/harbor-llmops/llmops-knowledge:0.0.1
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - secretRef:
                name: llmops-knowledge-env
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 20
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: llmops-knowledge
  namespace: llmops
spec:
  selector:
    app: llmops-knowledge
  ports:
    - name: http
      port: 8000
      targetPort: http
  type: ClusterIP
