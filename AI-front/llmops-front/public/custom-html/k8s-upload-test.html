<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>K8s 文件上传测试</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: #f5f7fa;
      color: #1f2d3d;
    }

    .k8s-upload-test-container {
      max-width: 1120px;
      margin: 0 auto;
      padding: 24px;
    }

    .page-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 16px;
    }

    .page-title {
      font-size: 24px;
      font-weight: 600;
      line-height: 1.4;
    }

    .page-subtitle {
      margin-top: 6px;
      color: #7a8599;
      font-size: 13px;
      line-height: 1.6;
    }

    .card {
      background: #fff;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: 0 8px 24px rgba(31, 45, 61, 0.06);
    }

    .search-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 16px;
    }

    .form-item {
      display: flex;
      flex-direction: column;
    }

    .grid-span-2 {
      grid-column: span 2;
    }

    .form-label {
      font-size: 13px;
      color: #4f5d73;
      margin-bottom: 8px;
    }

    .form-item input,
    .form-item textarea {
      width: 100%;
      border: 1px solid #dcdfe6;
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
      background: #fff;
    }

    .form-item input:focus,
    .form-item textarea:focus {
      border-color: #409eff;
      box-shadow: 0 0 0 2px rgba(64, 158, 255, 0.12);
    }

    .action-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 16px;
    }

    .button-group {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    button {
      border: none;
      border-radius: 8px;
      padding: 10px 18px;
      font-size: 14px;
      cursor: pointer;
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    button:hover {
      opacity: 0.92;
      transform: translateY(-1px);
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .primary-btn {
      background: #409eff;
      color: #fff;
    }

    .default-btn {
      background: #eef2f7;
      color: #1f2d3d;
    }

    .tip {
      color: #909399;
      font-size: 12px;
      line-height: 1.6;
      word-break: break-all;
    }

    .section-title {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 12px;
    }

    .status {
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 12px;
      display: none;
    }

    .status.success {
      display: block;
      background: #f0f9eb;
      color: #67c23a;
      border: 1px solid #e1f3d8;
    }

    .status.error {
      display: block;
      background: #fef0f0;
      color: #f56c6c;
      border: 1px solid #fde2e2;
    }

    .file-meta {
      font-size: 13px;
      color: #606266;
    }

    .result-box {
      min-height: 320px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      white-space: pre-wrap;
      line-height: 1.6;
      background: #0f172a;
      color: #e2e8f0;
    }

    @media (max-width: 1200px) {
      .search-grid {
        grid-template-columns: repeat(3, 1fr);
      }

      .grid-span-2 {
        grid-column: span 3;
      }
    }

    @media (max-width: 768px) {
      .k8s-upload-test-container {
        padding: 16px;
      }

      .page-header {
        flex-direction: column;
        align-items: flex-start;
      }

      .search-grid {
        grid-template-columns: 1fr;
      }

      .grid-span-2 {
        grid-column: span 1;
      }
    }
  </style>
</head>
<body>
  <div class="k8s-upload-test-container">
    <div class="page-header">
      <div>
        <div class="page-title">K8s 文件上传静态测试页</div>
        <div class="page-subtitle">用于调用 `/api/k8s-file/apps/v1/namespaces/{namespace}/pods/{name}/upload`，验证上传链路是否正常。</div>
      </div>
    </div>

    <div class="card">
      <div class="search-grid">
        <div class="form-item">
          <label class="form-label" for="baseUrl">接口前缀</label>
          <input id="baseUrl" type="text" placeholder="例如 /llmops-service 或 http://127.0.0.1:8080/llmops-service" />
        </div>
        <div class="form-item">
          <label class="form-label" for="clusterName">clusterName</label>
          <input id="clusterName" type="text" placeholder="请输入 clusterName" />
        </div>
        <div class="form-item">
          <label class="form-label" for="namespace">namespace</label>
          <input id="namespace" type="text" placeholder="请输入 namespace" />
        </div>
        <div class="form-item">
          <label class="form-label" for="podName">podName</label>
          <input id="podName" type="text" placeholder="请输入 podName" />
        </div>
        <div class="form-item">
          <label class="form-label" for="filePath">容器内路径</label>
          <input id="filePath" type="text" placeholder="例如 /tmp/upload-test.txt" />
        </div>
        <div class="form-item grid-span-2">
          <label class="form-label" for="uploadFile">本地文件</label>
          <input id="uploadFile" type="file" />
        </div>
        <div class="form-item grid-span-2">
          <label class="form-label" for="notes">说明</label>
          <textarea id="notes" rows="3" readonly></textarea>
        </div>
      </div>

      <div class="action-bar">
        <div class="tip" id="requestPreview"></div>
        <div class="button-group">
          <button class="default-btn" id="fillExampleBtn" type="button">填充示例</button>
          <button class="default-btn" id="clearBtn" type="button">清空结果</button>
          <button class="primary-btn" id="submitBtn" type="button">上传文件</button>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="section-title">执行结果</div>
      <div id="statusBox" class="status"></div>
      <textarea id="resultBox" class="result-box" rows="18" readonly placeholder="上传结果会显示在这里"></textarea>
    </div>
  </div>

  <script>
    (function () {
      const baseUrlInput = document.getElementById("baseUrl");
      const clusterNameInput = document.getElementById("clusterName");
      const namespaceInput = document.getElementById("namespace");
      const podNameInput = document.getElementById("podName");
      const filePathInput = document.getElementById("filePath");
      const uploadFileInput = document.getElementById("uploadFile");
      const notesInput = document.getElementById("notes");
      const requestPreview = document.getElementById("requestPreview");
      const statusBox = document.getElementById("statusBox");
      const resultBox = document.getElementById("resultBox");
      const submitBtn = document.getElementById("submitBtn");
      const clearBtn = document.getElementById("clearBtn");
      const fillExampleBtn = document.getElementById("fillExampleBtn");

      function getQuery(name) {
        const params = new URLSearchParams(window.location.search);
        return params.get(name) || "";
      }

      function normalizeBaseUrl(baseUrl) {
        const trimmed = (baseUrl || "").trim();
        if (!trimmed) return "/llmops-service";
        return trimmed.endsWith("/") ? trimmed.slice(0, -1) : trimmed;
      }

      function buildRequestUrl() {
        const baseUrl = normalizeBaseUrl(baseUrlInput.value);
        const namespace = encodeURIComponent(namespaceInput.value.trim());
        const podName = encodeURIComponent(podNameInput.value.trim());
        return `${baseUrl}/api/k8s-file/apps/v1/namespaces/${namespace}/pods/${podName}/upload`;
      }

      function updatePreview() {
        requestPreview.textContent = `POST ${buildRequestUrl()}`;
      }

      function setStatus(type, message) {
        statusBox.className = `status ${type}`;
        statusBox.textContent = message;
      }

      function clearStatus() {
        statusBox.className = "status";
        statusBox.textContent = "";
      }

      function prettyPrint(data) {
        if (typeof data === "string") return data;
        try {
          return JSON.stringify(data, null, 2);
        } catch (error) {
          return String(data);
        }
      }

      function buildErrorPayload(error, responseText) {
        return {
          message: error && error.message ? error.message : "请求失败",
          responseText: responseText || ""
        };
      }

      function initDefaults() {
        baseUrlInput.value = getQuery("baseUrl") || "/llmops-service";
        clusterNameInput.value = getQuery("clusterName");
        namespaceInput.value = getQuery("namespace");
        podNameInput.value = getQuery("podName");
        filePathInput.value = getQuery("filePath") || "/tmp/upload-test.txt";
        notesInput.value = [
          "1. 该页面为纯静态 HTML，可直接放在 public/custom-html 下访问。",
          "2. 请求头会带上 clusterName；body 使用 multipart/form-data，包含 path 和 file。",
          "3. 如果存在跨域，请通过同源代理地址访问，例如 /llmops-service。"
        ].join("\\n");
        updatePreview();
      }

      async function submitUpload() {
        const file = uploadFileInput.files[0];
        const namespace = namespaceInput.value.trim();
        const podName = podNameInput.value.trim();
        const filePath = filePathInput.value.trim();
        const clusterName = clusterNameInput.value.trim();

        if (!clusterName) {
          setStatus("error", "clusterName 不能为空");
          return;
        }
        if (!namespace) {
          setStatus("error", "namespace 不能为空");
          return;
        }
        if (!podName) {
          setStatus("error", "podName 不能为空");
          return;
        }
        if (!filePath) {
          setStatus("error", "容器内路径不能为空");
          return;
        }
        if (!file) {
          setStatus("error", "请先选择本地文件");
          return;
        }

        clearStatus();
        submitBtn.disabled = true;
        submitBtn.textContent = "上传中...";

        const formData = new FormData();
        formData.append("path", filePath);
        formData.append("file", file);

        const requestInfo = {
          url: buildRequestUrl(),
          headers: {
            clusterName: clusterName
          },
          formData: {
            path: filePath,
            fileName: file.name,
            fileSize: file.size,
            fileType: file.type
          }
        };

        try {
          const response = await fetch(buildRequestUrl(), {
            method: "POST",
            headers: {
              clusterName: clusterName
            },
            body: formData,
            credentials: "include"
          });

          const responseText = await response.text();
          let parsedBody = responseText;
          try {
            parsedBody = responseText ? JSON.parse(responseText) : "";
          } catch (error) {}

          resultBox.value = prettyPrint({
            request: requestInfo,
            response: {
              ok: response.ok,
              status: response.status,
              statusText: response.statusText,
              body: parsedBody
            }
          });

          if (!response.ok) {
            setStatus("error", `上传失败：${response.status} ${response.statusText}`);
            return;
          }

          setStatus("success", "上传成功");
        } catch (error) {
          resultBox.value = prettyPrint({
            request: requestInfo,
            error: buildErrorPayload(error)
          });
          setStatus("error", `上传失败：${error.message || "未知错误"}`);
        } finally {
          submitBtn.disabled = false;
          submitBtn.textContent = "上传文件";
        }
      }

      function clearResult() {
        clearStatus();
        resultBox.value = "";
      }

      function fillExample() {
        if (!clusterNameInput.value.trim()) clusterNameInput.value = "default";
        if (!namespaceInput.value.trim()) namespaceInput.value = "default";
        if (!podNameInput.value.trim()) podNameInput.value = "example-pod";
        if (!filePathInput.value.trim()) filePathInput.value = "/tmp/upload-test.txt";
        updatePreview();
      }

      [baseUrlInput, namespaceInput, podNameInput].forEach(function (input) {
        input.addEventListener("input", updatePreview);
      });

      submitBtn.addEventListener("click", submitUpload);
      clearBtn.addEventListener("click", clearResult);
      fillExampleBtn.addEventListener("click", fillExample);

      initDefaults();
    })();
  </script>
</body>
</html>
