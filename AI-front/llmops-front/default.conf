user  root;
worker_processes  1;
worker_rlimit_nofile  65535;

pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    '"$http_parentId" "$http_timestamp" "$http_signature"';

    sendfile on;
    keepalive_timeout 65;

    gzip on;
    gzip_comp_level 3;
    gzip_types text/plain application/x-javascript text/css application/xml text/javascript application/javascript image/jpeg image/gif image/png image/jpg;
    gzip_disable "MSIE [1-6]\.";

    client_max_body_size 256M;
    client_body_buffer_size 128k;

    fastcgi_connect_timeout 1200s;
    fastcgi_send_timeout 1200s;
    fastcgi_read_timeout 1200s;

    server {
        listen 80 default_server;

        access_log /var/log/nginx/system-access.log main;
        error_log  /var/log/nginx/system-error.log warn;

        # 前端静态资源 + SPA 路由回退
        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
            add_header Cache-Control max-age=2592000;
        }

        # 视频文件专项优化：支持 Range 请求（快进/快退）
        location ~* \.(mp4|ogg|webm)$ {
            add_header Accept-Ranges bytes;
            # 某些环境可能需要开启 mp4 模块，但基础 Nginx 开启 sendfile 即可支持大部分快进需求
            sendfile on;
            tcp_nopush on;
            # 关闭压缩，防止干扰 Range 请求
            gzip off;
        }

        location = /index.html {
            root /usr/share/nginx/html;
            add_header Cache-Control no-cache;
        }

        # 原有业务代理
        location ^~ /service/ {
            proxy_pass http://ebp_business_gateway:20000/;

            proxy_redirect off;
            proxy_cookie_path / /service/;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Host $remote_addr;
            proxy_set_header X-Forwarded-Server $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_connect_timeout 1200s;
            proxy_send_timeout 1200s;
            proxy_read_timeout 1200s;
        }
         # 新增：Ollama 虚拟机代理
        location ^~ /ollama/ {
            proxy_pass http://192.168.224.248:11434/;

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # SSE 流式关键配置
            proxy_buffering off;
            proxy_cache off;
            gzip off;

            proxy_connect_timeout 60s;
            proxy_send_timeout 3600s;
            proxy_read_timeout 3600s;
        }

        # 新增：AI 后端代理（Node/Express）
        location ^~ /api/ {
            proxy_pass http://192.168.224.181:3001;

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # SSE 流式关键配置
            proxy_buffering off;
            proxy_cache off;
            gzip off;

            proxy_connect_timeout 60s;
            proxy_send_timeout 3600s;
            proxy_read_timeout 3600s;
        }
        location ^~ /webssh {
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_pass  http://ailabx-kube-webssh:20000/ws;
        }

        location ^~ /pvcviewer/ {
            proxy_pass http://192.168.75.239:30088/;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_connect_timeout 1200s;
            proxy_send_timeout 1200s;
            proxy_read_timeout 1200s;
        }

    }
}
