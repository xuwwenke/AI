spring:
  application:
    name: llmops-file
  flyway:
    enabled: false
  servlet:
    multipart:
      # 单个文件最大大小 - 支持 50GB
      max-file-size: 50GB
      # 请求最大大小 - 支持 50GB
      max-request-size: 50GB
      # 文件大小阈值，超过这个大小会写入磁盘而不是内存
      file-size-threshold: 100MB
      # 临时文件存放位置
      location: ${java.io.tmpdir}
  datasource:
    dynamic:
      primary: llmops-file
      hikari:
      # 核心：保活检测间隔，向MySQL发送ping，防止连接被服务端断开（HikariCP 2.6+支持）
      # 建议设为 60秒，即每分钟保活一次
        keepalive-time: 60000
        max-lifetime: 600000
        idle-timeout: 300000
        connection-timeout: 30000
        connection-test-query: SELECT 1
      datasource:
        llmops-file:
          url: jdbc:mysql://${DATABASE_HOST:mysql}:${DATABASE_PORT:3306}/${DATABASE_NAME:llmops_file}?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true&allowMultiQueries=true&serverTimezone=Asia/Shanghai&useAffectedRows=true
          username: ${DATABASE_USERNAME:root}
          password: ${DATABASE_PASSWORD:netDc@#su}
        kubeflow:
          url: jdbc:mysql://${KUBEFLOW_DATABASE_HOST:mysql}:${KUBEFLOW_DATABASE_PORT:3306}/${KUBEFLOW_DATABASE_NAME:kubeflow}?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true&allowMultiQueries=true&serverTimezone=Asia/Shanghai&useAffectedRows=true
          username: ${KUBEFLOW_DATABASE_USERNAME:root}
          password: ${KUBEFLOW_DATABASE_PASSWORD:netDc@#su}



minio:
  endpoint: ${MINIO_ENDPOINT}
  accessKey: ${MINIO_ACCESS_KEY}
  secretKey: ${MINIO_SECRET_KEY}
  publicEndpoint: ${MINIO_PUBLIC_ENDPOINT}






server:
  port: 8080


eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_ADDRESS:http://eureka:8080/eureka}
  instance:
    prefer-ip-address: ${preferIpAddress:true}
    ip-address: llmops-file
    non-secure-port: 8080




eversec:
  dynamic-flyway:
    llmops-file:
      order: 200
      table: flyway_llmops_file
      dynamic-datasource: llmops-file
      baseline-on-migrate: true
      baseline-version: '0'
      enabled: true
      ignore-missing-migrations: false
      locations:
        - classpath:db/migration
      out-of-order: true
      placeholder-prefix: '#('
      placeholder-suffix: )
      validate-on-migrate: true
