[project]
name = "k8s-intelligent-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "xuewenke", email = "xuewenke@eversec.cn" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.165.0",
    "httpx>=0.28.1",
    "kubernetes>=37.0.3",
    "langchain>=1.2,<1.3",
    "langchain-ollama>=1,<2",
    "langchain-openai>=1.8.5",
    "langgraph>=1,<2",
    "pydantic-settings>=2.16.3",
    "python-dotenv>=1.2.4",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
k8s-intelligent-agent = "k8s_intelligent_agent:main"

[build-system]
requires = ["uv_build>=0.12.16,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.6",
]
